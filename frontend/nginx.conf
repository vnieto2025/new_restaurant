server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Un Excel de 2 MB en base64 pesa 2,7 MB (la importación de productos valida su propio límite)
    client_max_body_size 4m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /api/login -> http://backend:8000/login (se quita el prefijo /api)
    # También lleva el WebSocket de tiempo real: /api/ws -> backend:8000/ws
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las pantallas de cocina mantienen el WebSocket abierto toda la jornada (envían ping cada 25 s)
        proxy_read_timeout 120s;
    }

    # Archivos de Vite con hash en el nombre: se pueden guardar en caché por mucho tiempo
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de la app (/mesas, /produccion, /q/<token>...) las resuelve Vue Router
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# Upgrade solo cuando el cliente lo pide (WebSocket); en peticiones normales, conexión de siempre
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
