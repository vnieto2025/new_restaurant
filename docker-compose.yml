# RestaurantERP: base de datos, backend y frontend.
# Uso: copie .env.example a .env, complete las claves y ejecute:  docker compose up -d --build
# La app queda en http://<servidor>:${APP_PORT}. Solo el frontend publica un puerto;
# el backend y Postgres quedan en la red interna. Instalación y respaldos: docs/40A.

# Los registros no pueden llenar el disco
x-registros: &registros
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  db:
    <<: *registros
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASS:?Falta DB_PASS en .env}
      POSTGRES_DB: ${DB_NAME:?Falta DB_NAME en .env}
    volumes:
      # Postgres 18 guarda los datos en un subdirectorio de versión dentro de /var/lib/postgresql
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *registros
    build: ./backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Al arrancar aplica las migraciones
      start_period: 60s
    environment:
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      MY_SECRET_KEY: ${MY_SECRET_KEY:?Falta MY_SECRET_KEY en .env}
      PUBLIC_URL: ${PUBLIC_URL:?Falta PUBLIC_URL en .env}
      # La app corre con un rol sin privilegios para que RLS la limite; seed.py lo crea
      DB_APP_USER: ${DB_APP_USER:?Falta DB_APP_USER en .env}
      DB_APP_PASS: ${DB_APP_PASS:?Falta DB_APP_PASS en .env}
    depends_on:
      db:
        condition: service_healthy

  # Un respaldo diario, verificado, en la carpeta RESPALDOS_DIR del servidor (doc 40, sección 6)
  respaldos:
    <<: *registros
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/ops/respaldar.sh"]
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASS}
      PGDATABASE: ${DB_NAME}
      RESPALDO_HORA: ${RESPALDO_HORA:-04}
      RESPALDO_DIAS: ${RESPALDO_DIAS:-30}
    volumes:
      - ./ops:/ops:ro
      - ${RESPALDOS_DIR:-./respaldos}:/respaldos
    depends_on:
      db:
        condition: service_healthy

  frontend:
    <<: *registros
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
