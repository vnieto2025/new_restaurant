# Pruebas automáticas en cada envío a GitHub: backend contra Postgres y compilación del frontend.
# Los recorridos en el navegador (e2e/) se corren a mano: necesitan la aplicación completa en marcha.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DB_USER: postgres
      DB_PASS: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: restaurant
      DB_NAME_TEST: restaurant_test
      # Rol sin privilegios con el que corre la aplicación: así Row Level Security se prueba de verdad
      DB_APP_USER: restaurant_app
      DB_APP_PASS: clave-solo-para-ci
      MY_SECRET_KEY: clave-de-firma-solo-para-ci-0123456789abcdef
      PUBLIC_URL: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    name: Paquete de Docker
    runs-on: ubuntu-latest
    env:
      E2E_APP: http://localhost
      E2E_API: http://localhost/api
      E2E_NAVEGADOR: chromium
    steps:
      - uses: actions/checkout@v4
      - name: Claves de prueba
        run: |
          cp .env.example .env
          {
            echo "DB_PASS=clave-solo-para-ci"
            echo "DB_APP_PASS=otra-clave-solo-para-ci"
            echo "MY_SECRET_KEY=clave-de-firma-solo-para-ci-0123456789abcdef"
          } >> .env
      - name: Construir y levantar
        run: docker compose up -d --build --wait
      - name: Datos demo
        run: docker compose exec -T backend python seed.py --demo --superadmin soporte --password Soporte12345 --nombre Soporte
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Preparar el navegador
        working-directory: e2e
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Recorrido completo por nginx (incluye WebSocket)
        working-directory: e2e
        run: python fase1.py
      - name: Salud, respaldo y restauración
        run: python e2e/prueba_docker.py
      # Sin sesión en GitHub los registros no se pueden leer; las anotaciones sí
      - name: Mostrar el error
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=40 > registros.txt 2>&1
          tail -n 12 registros.txt | sed 's/^/::error::/'

  frontend:
    name: Frontend (compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
